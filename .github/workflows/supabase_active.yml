name: Keep Supabase alive

on:
  schedule:
    - cron: "0 12 */2 * *" # a cada 2 dias, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch: # permite disparar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # GET /posts é público e faz query no Postgres do Supabase,
      # o que conta como atividade e impede a pausa do projeto free.
      # --retry cobre o cold start do Render (plano free hiberna).
      - name: Ping API (toca o banco do Supabase)
        run: |
          curl --silent --show-error --fail \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            "https://rathole-back.onrender.com/posts" > /dev/null
          echo "Banco pingado com sucesso"
